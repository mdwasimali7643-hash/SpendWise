
name: Build SpendWISE Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: android-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore release signing key
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$KEY_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEY_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/spendwise-release.jks"

          test -s "$RUNNER_TEMP/spendwise-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/spendwise-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Signing keystore restored and alias verified."

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android app version
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.is_file():
              raise SystemExit(
                  "android/app/build.gradle not found. "
                  "Check the generated Android project."
              )

          content = path.read_text()

          content, code_count = re.subn(
              r'(?m)^(\s*versionCode\s+)\d+\s*$',
              r'\g<1>210',
              content,
              count=1
          )

          content, name_count = re.subn(
              r'(?m)^(\s*versionName\s+)[\'"][^\'"]*[\'"]\s*$',
              r'\g<1>"2.1.0"',
              content,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  "Could not safely set versionCode and versionName. "
                  "Check the generated build.gradle format."
              )

          path.write_text(content)

          print("Android versionName: 2.1.0")
          print("Android versionCode: 210")
          PY

      - name: Generate Android app icons
        run: |
          npm install --save-dev @capacitor/assets
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#00251B' \
            --iconBackgroundColorDark '#00251B'

      - name: Build release APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Align and sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          FINAL_APK="$RUNNER_TEMP/SpendWISE-v2.1.0-release.apk"

          if [ ! -f "$UNSIGNED" ]; then
            echo "Unsigned release APK not found."
            find android/app/build/outputs/apk -type f -name "*.apk"
            exit 1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/spendwise-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$FINAL_APK" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose "$FINAL_APK"

          echo "Signed APK created successfully."

      - name: Encrypt keystore backup
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BACKUP_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/spendwise-release.jks" \
            -out "$RUNNER_TEMP/spendwise-release.jks.enc" \
            -pass env:BACKUP_PASSWORD

          test -s "$RUNNER_TEMP/spendwise-release.jks.enc"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: SpendWISE-v2.1.0-release-APK
          path: ${{ runner.temp }}/SpendWISE-v2.1.0-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload encrypted keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: SpendWISE-encrypted-keystore-backup
          path: ${{ runner.temp }}/spendwise-release.jks.enc
          if-no-files-found: error
          retention-days: 90
